services:
  service-package-follower:
    build:
      context: ../../backend
      dockerfile: services/packageFollower/.cloud/docker/Dockerfile
      target: plugin-dev
      args:
        - PLUGINNAME=packageFollower
        - KIND=services
    image: codeclarityce/service-package-follower-dev:latest
    restart: always
    # The follower runs as its own role, like production; `compose exec` sessions (the knowledge
    # update and the dump's completeness gate) keep the stack's postgres login.
    command: ["env", "PG_DB_USER=cc_follower", "air", "-c", ".air.toml"]
    volumes:
      - ../../backend:/codeclarity
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    env_file:
      - ../../.cloud/env/.env.dev

volumes:
  projects:
